<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程反馈 · 获取数据</title><style>
body{margin:0;background:#f1f5f6;color:#193b49;font:16px/1.75 "Microsoft YaHei",sans-serif}main{max-width:980px;padding:40px 24px;margin:auto}small{letter-spacing:2px;color:#5b808c}h1{font-size:30px;margin:8px 0}h2{font-size:20px;margin:0 0 15px}p{margin:8px 0}.panel{padding:26px;background:white;border:1px solid #d7e3e8;border-radius:12px;margin:22px 0}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #b9cdd4;border-radius:7px;font-size:16px}button,a.button{display:inline-block;font:inherit;padding:10px 18px;margin:14px 10px 0 0;border:0;border-radius:7px;background:#236579;color:white;cursor:pointer;text-decoration:none}button.secondary{background:#e7eff2;color:#285a6a}button:disabled{opacity:.55;cursor:wait}.muted{color:#697f89;font-size:14px}.success{color:#227757;background:#ecf7f1;border-left:4px solid #2c8b66;padding:15px}.error{color:#a74536}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:17px;background:#f4f8f9;border:1px solid #d8e5e9;border-radius:8px;overflow-wrap:anywhere}.card strong{display:block;font-size:26px;color:#236579}.step{padding:7px 0;border-bottom:1px solid #edf2f3}dialog{border:0;border-radius:12px;max-width:420px;width:90vw;padding:25px}dialog::backdrop{background:#18374477}#qr{width:260px;max-width:100%;display:block;margin:15px auto}a{color:#236579}details{margin-top:15px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#preview blockquote{padding:8px 12px;background:#f3f7f8;margin:8px 0;border-left:3px solid #83abb7}.actions{display:flex;flex-wrap:wrap;align-items:center}footer{font-size:13px;color:#71848c}@media(max-width:650px){.cards{grid-template-columns:1fr}h1{font-size:25px}main{padding:24px 15px}.panel{padding:18px}}
[hidden]{display:none!important}
</style></head><body><main><small>COURSE FEEDBACK / 真实课程数据</small><h1>输入一节课，获取本次可用的素材</h1><p class="muted">先确认视频和弹幕已真实保存，再进入课程分析。</p>
<section class="panel"><label for="url">B站课程链接</label><input id="url" placeholder="https://www.bilibili.com/video/BV..." value="https://www.bilibili.com/video/BV1Y2DGYoEEw/"><div class="actions"><button id="fetch">获取数据</button><button class="secondary" id="login">登录B站</button><button class="secondary" id="logout">清除本地会话</button></div><p class="muted" id="loginStatus">正在读取登录状态…</p><p class="muted">获取当次可用弹幕快照及视频。无需先配置分析模型；需要登录时可在官方页面扫码确认。</p><p id="error" class="error" role="alert"></p></section>
<section class="panel"><h2>获取结果</h2><p id="headline" role="status">尚未开始</p><p class="muted" id="course"></p><div id="cards" class="cards"></div><div id="steps"></div><div class="actions"><button class="secondary" id="showComments" hidden>查看已获取的弹幕</button><a class="button" id="downloadComments" hidden>下载规范化弹幕</a></div><div id="preview"></div><p id="saved" class="muted"></p><details><summary>查看本次获取记录</summary><pre id="record"></pre></details></section>
<footer>获取成功仅表示所列文件已保存并校验。分析与模型评价独立执行。<br><a href="/example">规则基线演示</a> · <a href="/media-example">模型联合试跑与错误案例</a></footer>
<dialog id="loginDialog"><h2>连接B站登录会话</h2><p id="qrStatus">正在生成官方登录二维码…</p><img id="qr" alt="B站官方登录二维码"><a id="officialLogin" target="_blank" rel="noopener noreferrer">打开B站官方登录页面</a><p class="muted">请使用自己的B站App扫码并确认。会话保留在本机进程中，临时任务文件完成后清除；不会发送到模型或GitHub。</p><button id="closeLogin" class="secondary">关闭</button></dialog>
</main><script>
const token='__TOKEN__';const $=id=>document.getElementById(id);let activeId=null,pollTimer=null,loginTimer=null,offset=0;
const names={metadata:'课程信息',danmaku:'弹幕快照',video:'视频与音频下载',video_validation:'媒体校验'};const statuses={running:'进行中',completed:'已完成',failed:'失败'};
const fmt=s=>Math.floor(s/60).toString().padStart(2,'0')+':'+Math.floor(s%60).toString().padStart(2,'0');
function el(tag,text,cls){let x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
async function api(path,data){let r=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Demo-Token':token},body:JSON.stringify(data)});let d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
function draw(d){$('record').textContent=JSON.stringify(d,null,2);$('cards').replaceChildren();$('steps').replaceChildren();let a=d.artifacts||{};
if(a.metadata){let c=el('div',undefined,'card');c.append(el('strong',fmt(a.metadata.duration_s)),el('span','已获取课程信息'));$('cards').append(c)}
if(a.danmaku){let c=el('div',undefined,'card');c.append(el('strong',a.danmaku.valid_count.toLocaleString()+' 条'),el('span','已获取带时间戳弹幕'),el('p','当次可用快照','muted'));$('cards').append(c)}
if(a.video){let c=el('div',undefined,'card');c.append(el('strong',a.video.width+' × '+a.video.height),el('span','已获取含音轨视频'),el('p',(a.video.bytes/1048576).toFixed(1)+' MiB · '+fmt(Math.round(a.video.duration_s)),'muted'));$('cards').append(c)}
$('course').textContent=d.title?(d.title+' · P'+d.part+' · '+d.observed_at):'';
const done=d.status==='acquired'||d.status==='snapshot_acquired';$('headline').className=done?'success':'';
$('headline').textContent=done?('已成功获取'+(a.video?'视频、':'')+'课程信息和 '+(a.danmaku?.valid_count??0)+' 条带时间戳弹幕'):d.status==='running'?'正在获取真实素材…':((Object.keys(a).length?'部分素材已获取，尚有环节失败：':'未能获取素材：')+(d.error||d.status));
for(const s of d.stages||[]){let text=(names[s.name]||s.name)+'：'+(statuses[s.status]||s.status);if(s.status==='running'&&s.downloaded_bytes)text+=' · 当前文件已下载 '+(s.downloaded_bytes/1048576).toFixed(1)+' MiB';$('steps').append(el('div',text,'step'))}
$('showComments').hidden=!a.danmaku;$('downloadComments').hidden=!a.danmaku;$('downloadComments').href='/api/acquisition/'+activeId+'/download';$('saved').textContent=a.danmaku?'已保存到本机项目 outputs 目录。此处显示的是实际校验数量。':'';$('fetch').disabled=d.status==='running';}
async function poll(){try{let d=await api('/api/acquisition/'+activeId);draw(d);if(d.status==='running')pollTimer=setTimeout(poll,1500)}catch(e){$('error').textContent=e.message;$('fetch').disabled=false}}
$('fetch').onclick=async()=>{clearTimeout(pollTimer);$('error').textContent='';$('preview').replaceChildren();offset=0;$('fetch').disabled=true;try{let d=await api('/api/acquire',{url:$('url').value});activeId=d.id;poll()}catch(e){$('error').textContent=e.message;$('fetch').disabled=false}};
$('showComments').onclick=async()=>{try{let d=await api('/api/acquisition/'+activeId+'/comments?offset='+offset);if(offset===0)$('preview').replaceChildren();for(const c of d.comments){$('preview').append(el('blockquote',fmt(c.playback_ms/1000)+' · '+c.text))}offset+=d.comments.length;$('showComments').textContent=offset<d.total?'继续查看弹幕（已展示'+offset+' / '+d.total+'）':'重新查看弹幕';if(offset>=d.total)offset=0}catch(e){$('error').textContent=e.message}};
async function loginStatus(){let d=await api('/api/login/status');$('loginStatus').textContent=d.message}
async function pollLogin(){try{let d=await api('/api/login/poll',{});$('qrStatus').textContent=d.message;$('loginStatus').textContent=d.message;if(d.logged_in){$('loginDialog').close();return}if($('loginDialog').open)loginTimer=setTimeout(pollLogin,4000)}catch(e){$('qrStatus').textContent=e.message}}
$('login').onclick=async()=>{clearTimeout(loginTimer);$('loginDialog').showModal();try{let d=await api('/api/login/start',{});$('qr').src=d.qr_image;$('officialLogin').href=d.login_url;$('qrStatus').textContent=d.message;pollLogin()}catch(e){$('qrStatus').textContent=e.message}};
$('closeLogin').onclick=()=>{clearTimeout(loginTimer);$('loginDialog').close()};$('logout').onclick=async()=>{try{let d=await api('/api/login/clear',{});$('loginStatus').textContent=d.message}catch(e){$('error').textContent=e.message}};
loginStatus().catch(e=>$('loginStatus').textContent=e.message);api('/api/acquisition/latest').then(d=>{if(d.id){activeId=d.id;poll()}}).catch(()=>{});
</script></body></html>
